name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  windows-release:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Build distributables
        run: npm run make

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: groups-console-${{ github.ref_name }}-windows
          path: |
            out/make/**/*.exe
            out/make/**/*.nupkg
            out/make/**/RELEASES
            out/make/**/*.zip
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $assets = Get-ChildItem -Path out/make -Recurse -File -Include *.exe,*.nupkg,RELEASES,*.zip |
            ForEach-Object { $_.FullName }

          if ($assets.Count -eq 0) {
            throw 'No release assets were produced under out/make.'
          }

          gh release create $env:TAG_NAME @assets --title "Groups Console $env:TAG_NAME" --generate-notes
