name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  windows-release:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Verify
        run: npm run verify

      - name: Build distributables
        run: npm run make

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: groups-console-${{ github.ref_name }}-windows
          path: |
            out/make/**/*.exe
            out/make/**/*.nupkg
            out/make/**/RELEASES
            out/make/**/*.zip
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $assets = Get-ChildItem -Path out/make -Recurse -File -Include *.exe,*.nupkg,RELEASES,*.zip |
            ForEach-Object { $_.FullName }

          if ($assets.Count -eq 0) {
            throw 'No release assets were produced under out/make.'
          }

          $previousTag = git describe --tags --abbrev=0 "$env:TAG_NAME^" 2>$null
          if ($LASTEXITCODE -eq 0 -and -not [string]::IsNullOrWhiteSpace($previousTag)) {
            $commitRange = "$previousTag..$env:TAG_NAME"
          } else {
            $commitRange = $env:TAG_NAME
          }

          $candidateCommits = @(
            git log $commitRange --first-parent --no-merges --format='%H%x09%s (%h)' |
              Where-Object { $_ -notmatch "^[^\t]+\tchore\(release\): " }
          )

          $directCommits = @()
          foreach ($commit in $candidateCommits) {
            $sha, $summary = $commit -split "`t", 2
            $associatedPullRequestCount = gh api "repos/$env:GITHUB_REPOSITORY/commits/$sha/pulls" -H "Accept: application/vnd.github+json" --jq 'length' 2>$null
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($associatedPullRequestCount)) {
              $associatedPullRequestCount = 0
            }

            if ([int]$associatedPullRequestCount -eq 0) {
              $directCommits += "- $summary"
            }
          }

          $notesArgs = @()
          if ($directCommits.Count -gt 0) {
            $directCommitNotes = @(
              '## Direct Commits'
              ''
              $directCommits
              ''
            ) -join "`n"
            $notesArgs = @('--notes', $directCommitNotes)
          }

          gh release view $env:TAG_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG_NAME @assets --clobber
          } else {
            gh release create $env:TAG_NAME @assets --title "Groups Console $env:TAG_NAME" @notesArgs --generate-notes
          }
